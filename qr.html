<style>
:root{--cream:#f8f1dc;--brown:#3a1109;--red:#c01717;--gold:#d9a441;--hdr:58px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100svh;background:var(--cream);color:var(--brown);font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;height:calc(var(--hdr) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 18px 0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.09);display:flex;align-items:center;gap:10px}
header img{height:38px;width:auto;display:block}
header b{font-family:"Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:1.7rem;letter-spacing:.02em}
main{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:22px 18px max(26px,env(safe-area-inset-bottom,0px));text-align:center}
.pic{display:block;margin:0 auto;width:min(88vw,470px);height:auto}
h1{margin:8px 0 2px;font-size:clamp(2rem,8vw,3.1rem);line-height:1.1;font-weight:800}
.zh1{margin:0;font-size:clamp(1.2rem,4.6vw,1.5rem);font-weight:700}
.t{margin:6px 0 0;font-size:clamp(1rem,3.9vw,1.22rem);line-height:1.35}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(100%,400px);margin:18px auto 10px;padding:10px 22px 12px;border-radius:999px;background:linear-gradient(#cf1c1c,#b01111);border:3px solid var(--gold);box-shadow:0 4px 10px rgba(110,20,10,.3),0 0 0 1px #b8832b;color:#fff;text-decoration:none}
.btn:hover{filter:brightness(1.06)}.btn:focus-visible,.url:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
.b1{font-size:clamp(1.25rem,5.2vw,1.65rem);font-weight:700;line-height:1.2}.b2{font-size:.95rem;font-weight:500;opacity:.95}
.url{display:inline-block;margin-top:2px;font-size:1rem;color:#86806c;text-decoration:none}
.deco{position:fixed;inset:0;z-index:1;pointer-events:none}
.deco svg{position:absolute}
.co{width:clamp(62px,12vw,150px);aspect-ratio:1}
.tl{left:14px;top:calc(var(--hdr) + 18px)}.tr{right:14px;top:calc(var(--hdr) + 18px);transform:scaleX(-1)}
.bl{left:14px;bottom:14px;transform:scaleY(-1)}.br{right:14px;bottom:14px;transform:scale(-1,-1)}
.cl{stroke:#d8b89b;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.c1{right:7%;top:calc(var(--hdr) + 11%);width:clamp(80px,15vw,200px);aspect-ratio:2/1}
.c2{left:13%;top:41%;width:clamp(80px,11vw,150px);aspect-ratio:2/1}
.c3{left:8%;bottom:11%;width:clamp(90px,13vw,170px);aspect-ratio:2/1}
.sc{stroke:#c9a24a;fill:none;stroke-width:2.2;stroke-linecap:round;width:clamp(90px,13vw,170px);aspect-ratio:2/1}
.s1{left:6%;top:33%}.s2{right:0;top:36%;transform:scaleX(-1)}
@media(max-width:899px){.sc,.c2{display:none}}
@media(max-width:599px){.c3{display:none}.c1{right:3%;top:calc(var(--hdr) + 3%);width:84px;opacity:.7}}
</style></head><body>
